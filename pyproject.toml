[project]
name = "minerva-bot"
version = "0.1.0"
description = "A multi-server Discord bot for admin-only role and channel management"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "discord.py>=2.4.0",
    "pydantic-settings>=2.6.0",
    "aiosqlite>=0.20.0",
]

[project.scripts]
minerva-bot = "minerva_bot.__main__:run"

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minerva_bot"]

# ---------------------------------------------------------------------------
# Ruff: formatting + linting
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "ANN",  # type annotations
    "ASYNC",# async lint rules (important for discord.py)
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    "ANN401", # allow Any in specific dynamic cases
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S101"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy: strict type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
plugins = []

[[tool.mypy.overrides]]
module = "discord.*"
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
